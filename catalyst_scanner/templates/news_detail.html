<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ ticker }} Latest News</title>
<style>
:root{color-scheme:dark;--bg:#08101f;--card:#101b2e;--rule:#283750;--text:#edf3ff;--muted:#9badc6;--warm:#d9a441}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}
main{max-width:850px;margin:auto;padding:0 18px 18px}.top{position:sticky;top:0;background:rgba(8,16,31,.97);padding:calc(10px + env(safe-area-inset-top)) 0 10px;z-index:100;border-bottom:1px solid var(--rule)}
.header-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.close-button{width:44px;height:44px;min-width:44px;display:grid;place-items:center;padding:0;font-size:24px;border-radius:9px}.close-button svg{width:22px;height:22px;stroke:currentColor}
.fallback{display:none;margin-top:9px;padding:10px;border:1px solid var(--warm);border-radius:7px}.fallback a{color:#a9ccff;font-weight:700}
h1{margin:0;font-size:1.4rem}.summary{margin-top:8px;color:var(--warm);font-weight:700}.meta{color:var(--muted);font-size:.85rem}
article{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:14px;margin:12px 0}
article a{color:#a9ccff;font-weight:700;text-decoration:none}article a:hover{text-decoration:underline}
.score{float:right;border:1px solid var(--warm);border-radius:999px;padding:3px 8px;color:var(--warm)}
details{margin-top:10px;border-top:1px solid var(--rule);padding-top:8px}summary{cursor:pointer;color:#a9ccff;font-weight:700}
.components{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 12px;margin-top:8px}
button{background:var(--card);color:var(--text);border:1px solid var(--rule);padding:8px 11px;border-radius:7px}
@media(max-width:520px){main{padding:0 10px 10px;overflow-x:hidden}article{padding:12px}.score{float:none;display:inline-block;margin-bottom:8px}.components{grid-template-columns:1fr}}
</style></head><body><main>
<header class="top"><div class="header-row"><div><h1 id="title">{{ ticker }} latest news</h1><div id="summary" class="summary">Analyzing latest news…</div>
<div id="refresh" class="meta"></div></div><button id="close" class="close-button" type="button" aria-label="Close news window" title="Close"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M5 5l14 14M19 5L5 19"/></svg></button></div>
<button id="reload" type="button">Refresh news</button><div id="close-fallback" class="fallback">This browser did not allow the tab to close automatically. <a id="return-scanner" href="/">Return to Scanner</a></div></header>
<section id="articles" aria-live="polite"><p>Loading the four newest articles…</p></section>
</main><script>
const symbol={{ ticker|tojson }}, interval={{ refresh_seconds|tojson }};
let payload=null,timer=null,refreshTimer=null,controller=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ageLabel(s){s=Math.max(0,Math.floor(s));if(s<60)return `${s} second${s===1?'':'s'} ago`;let m=Math.floor(s/60);if(m<60)return `${m} minute${m===1?'':'s'} ago`;let h=Math.floor(m/60);m%=60;return `${h} hour${h===1?'':'s'} ago${m?` ${m} minute${m===1?'':'s'} ago`:''}`}
function classification(n){return n>=90?'Exceptional':n>=75?'Strong':n>=55?'Moderate':n>=30?'Weak':'Minimal'}
function renderDecay(){if(!payload)return;const now=Date.now()/1000;
 const scored=(payload.articles||[]).map(a=>({...a,ageSeconds:Math.max(0,now-a.publishedTimestamp)}));
 document.getElementById('summary').textContent=payload.scoreStatus==='ready'?`Combined score ${Math.round(payload.combinedScore)} · ${payload.combinedDirection.replaceAll('_',' ')} · Confidence ${Math.round(payload.confidence)}%`:(payload.scoreStatus==='no_relevant_articles'?'No relevant articles found':'News scoring unavailable');
 const yahoo=`<p><a href="${esc(payload.yahooFinanceUrl)}" target="_blank" rel="noopener noreferrer">Open this symbol on Yahoo Finance</a></p>`;
 document.getElementById('articles').innerHTML=scored.length?scored.map(a=>{const s=a.score;return `<article><span class="score">${s?.status==='ready'?'Article score '+Math.round(s.finalScore):'Score unavailable'}</span><a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">${esc(a.headline)}</a><p class="meta">Source: ${esc(a.originalPublisher||a.publisher)} · Located through: ${esc(a.discoverySource==='yahoo_finance'?'Yahoo Finance':(a.discoverySource||'licensed feed'))}</p><p class="meta">${a.publicationTimeAvailable?`Published: <time datetime="${esc(a.publishedAt)}">${esc(new Date(a.publishedTimestamp*1000).toLocaleString())}</time> · ${ageLabel(a.ageSeconds)}`:`Detected ${ageLabel(a.ageSeconds)} · Original publication time unavailable`}</p><p class="meta">${esc(a.catalystType)} · ${esc(s?.direction?.replaceAll('_',' ')||a.direction)} · Confidence ${Math.round(s?.confidence||0)}%</p>${s?`<details><summary>Why this article scored ${Math.round(s.finalScore)}</summary><div class="components"><span>Catalyst strength: ${Math.round(s.catalystStrength)}</span><span>Relevance: ${Math.round(s.relevance)}</span><span>Freshness: ${Math.round(s.freshness)}</span><span>Source confidence: ${Math.round(s.sourceConfidence)}</span><span>Novelty: ${Math.round(s.novelty)}</span></div><p class="meta">${esc(s.explanation)}</p></details>`:''}</article>`}).join('')+`<details><summary>How the combined score was calculated</summary><p class="meta">${payload.aggregation.articlesConsidered} unique articles · ${payload.aggregation.duplicateArticlesExcluded} duplicates excluded · strongest articles receive the highest rank weight.</p></details>`+yahoo:`<p><strong>News status: Not located</strong></p><p class="meta">No recent symbol-specific news was located after checking Yahoo Finance, primary company and regulatory sources, and additional financial-news sources.</p>${yahoo}`;
}
async function load(force=false){if(controller)controller.abort();controller=new AbortController();document.getElementById('summary').textContent='Analyzing latest news…';
 document.getElementById('articles').innerHTML='<p>Checking Yahoo Finance…</p><p class="meta">Then checking primary company and regulatory sources, followed by additional financial-news sources.</p>';
 try{const r=await fetch(`/api/news/${encodeURIComponent(symbol)}?limit=4${force?'&refresh=1':''}`,{signal:controller.signal,cache:'no-store'});if(!r.ok)throw Error(r.status);payload=await r.json();const identity=payload.securityIdentity||{};document.getElementById('title').textContent=`${symbol}${identity.companyName?' · '+identity.companyName:''} latest news`;renderDecay();document.getElementById('refresh').textContent=`Last refresh: ${new Date().toLocaleTimeString()}${payload.cached?' · cached analysis':''}`;}
 catch(e){if(e.name!=='AbortError'){document.getElementById('summary').textContent='News unavailable';document.getElementById('articles').innerHTML='<p>Could not load news. Please retry.</p>'}}
}
function startTimers(){clearInterval(timer);clearInterval(refreshTimer);timer=setInterval(renderDecay,5000);refreshTimer=setInterval(load,interval*1000)}
function stopTimers(){clearInterval(timer);clearInterval(refreshTimer);timer=refreshTimer=null}
document.getElementById('reload').onclick=()=>load(true);load();startTimers();
document.getElementById('close').onclick=()=>{window.close();setTimeout(()=>{if(!window.closed)document.getElementById('close-fallback').style.display='block'},180)};
document.getElementById('return-scanner').onclick=ev=>{try{if(document.referrer&&new URL(document.referrer).origin===location.origin){ev.preventDefault();history.back()}}catch(_e){}};
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopTimers();else{renderDecay();startTimers()}});
addEventListener('pagehide',()=>{stopTimers();controller?.abort()});
</script></body></html>
