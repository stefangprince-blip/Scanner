# Cloudflare Tunnel configuration for the local Scanner app.
#
# After logging in with `cloudflared tunnel login`, create a named tunnel and
# route the permanent hostname below to it.
#
# Example commands:
#   cloudflared tunnel create Stefanscanner
#   cloudflared tunnel route dns Stefanscanner stefanscanner.pgrcapital.org
#   cloudflared tunnel run Stefanscanner
#
# If cloudflared cannot find your origin cert automatically, set:
#   TUNNEL_ORIGIN_CERT=C:\Users\<YOUR_USER>\.cloudflared\cert.pem

# tunnel: <TUNNEL_ID>
# credentials-file: C:\Users\<YOUR_USER>\.cloudflared\<TUNNEL_ID>.json

ingress:
  - hostname: stefanscanner.pgrcapital.org
    service: http://127.0.0.1:5057
  - service: http_status:404
