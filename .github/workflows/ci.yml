name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install pytest pytest-cov pytest-sugar

      - name: Run tests with coverage
        run: |
          mkdir -p test-results
          pytest --junitxml=test-results/junit-${{ matrix.python-version }}.xml --cov=. --cov-report=xml:test-results/coverage-${{ matrix.python-version }}.xml -q

      - name: Upload test report (JUnit)
        uses: actions/upload-test-report@v1
        with:
          path: test-results/junit-${{ matrix.python-version }}.xml

      - name: Upload test and coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results/

      - name: Upload coverage to Codecov (optional)
        if: ${{ secrets.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          files: test-results/coverage-${{ matrix.python-version }}.xml
          fail_ci_if_error: false

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('**/requirements.txt') }}

      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 mypy

      - name: Run flake8
        run: |
          flake8 .

      - name: Run mypy (type checking)
        run: |
          # Run mypy if configuration exists; fail the job on errors to enforce types
          if [ -f mypy.ini ] || [ -f setup.cfg ] || [ -f pyproject.toml ]; then
            mypy .
          else
            echo "No mypy config found; running mypy with defaults"
            mypy .
          fi

  audit-deps:
    name: Dependency audit (safety)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install safety
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Run safety check
        run: |
          safety check -r requirements.txt || true

  format-check:
    name: Format check (black)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install black
        run: |
          python -m pip install --upgrade pip
          python -m pip install black

      - name: Check formatting
        run: |
          black --check . || (echo "Run 'black .' to fix formatting" && exit 1)
